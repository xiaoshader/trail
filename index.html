<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>轻量互动圣诞树</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Arial', sans-serif; }
        
        /* UI 覆盖层 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffd700;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }
        h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        p { font-size: 12px; opacity: 0.8; margin-top: 5px; }
        .status { color: #ffffff; font-weight: bold; }

        /* 视频反馈窗口（可隐藏） */
        #video-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 120px; /* 更小 */
            height: 90px; /* 更小 */
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.3);
            z-index: 10;
            transform: scaleX(-1);
            opacity: 0.5; /* 更低透明度 */
            transition: opacity 0.3s;
        }
        #video-container:hover { opacity: 0.8; }
        #input_video { width: 100%; height: 100%; object-fit: cover; }

        /* 加载指示器 */
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: 16px;
            z-index: 100;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="ui-layer">
        <h1>✨ 圣诞树 (轻量版)</h1>
        <p>状态: <span id="hand-status" class="status">等待摄像头...</span></p>
    </div>

    <div id="loader">✨ 正在加载魔法...</div>

    <div id="video-container">
        <video id="input_video"></video>
    </div>

<script>
    // ================= CONFIGURATION (调整为轻量级) =================
    const PARTICLE_COUNT = 200; // 大幅减少粒子数量
    const TREE_HEIGHT = 30;
    const TREE_BASE_RADIUS = 10;

    // ================= THREE.JS SETUP =================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000); // 黑色背景

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 15, 50); // 调整相机位置

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio); // 手机上可能较低
    document.body.appendChild(renderer.domElement);

    // --- 灯光设置 (简化) ---
    const ambientLight = new THREE.AmbientLight(0x444444); // 适中环境光
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffcc00, 1.5, 100); // 一个主光源
    pointLight.position.set(0, 20, 30);
    scene.add(pointLight);

    // --- 移除后期处理 (Unreal Bloom)，减轻负担 ---
    // 原有的 composer 相关代码已移除，直接使用 renderer.render()

    // ================= MATERIALS (简化) =================
    const matGlowing = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.9 }); // 基础发光材质
    const matRed = new THREE.MeshBasicMaterial({ color: 0xdd0000 });
    const matGreen = new THREE.MeshBasicMaterial({ color: 0x00aa44 });

    // ================= CREATE PARTICLES =================
    const particles = [];
    
    // 使用更简单的几何体
    const geoSphereTiny = new THREE.SphereGeometry(0.3, 8, 8); // 更低面数
    const geoBoxTiny = new THREE.BoxGeometry(0.5, 0.5, 0.5);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        let mesh;
        const rand = Math.random();

        if (rand < 0.5) { // 50% 发光球
            mesh = new THREE.Mesh(geoSphereTiny, matGlowing);
        } else if (rand < 0.75) { // 25% 红色球
            mesh = new THREE.Mesh(geoSphereTiny, matRed);
        } else { // 25% 绿色方块
            mesh = new THREE.Mesh(geoBoxTiny, matGreen);
        }

        // --- 树形态位置计算 (保持原有的圆锥结构) ---
        const p = i / PARTICLE_COUNT;
        const heightProgress = Math.pow(p, 0.8); 
        const yTree = heightProgress * TREE_HEIGHT - (TREE_HEIGHT / 2);
        const radiusAtY = TREE_BASE_RADIUS * (1 - heightProgress);
        
        const angle = i * 0.7 + Math.random() * 0.5; // 更稀疏的螺旋
        const randomRadiusOffset = Math.random() * radiusAtY * 0.4; // 较小偏移
        
        const xTree = Math.cos(angle) * (radiusAtY - randomRadiusOffset);
        const zTree = Math.sin(angle) * (radiusAtY - randomRadiusOffset);
        
        // --- 爆炸形态位置计算 (简化) ---
        const explodeR = (Math.random() * 0.5 + 0.5) * 40; // 较小爆炸范围
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        
        const xExp = explodeR * Math.sin(phi) * Math.cos(theta);
        const yExp = explodeR * Math.sin(phi) * Math.sin(theta);
        const zExp = explodeR * Math.cos(phi);

        mesh.userData = {
            treePos: new THREE.Vector3(xTree, yTree, zTree),
            explodePos: new THREE.Vector3(xExp, yExp, zExp),
            rotSpeed: new THREE.Vector3( // 稍微慢一些的旋转速度
                (Math.random()-0.5)*0.03, 
                (Math.random()-0.5)*0.03, 
                (Math.random()-0.5)*0.03
            ),
            initialRot: new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI)
        };

        mesh.position.copy(mesh.userData.treePos);
        mesh.rotation.copy(mesh.userData.initialRot);
        
        scene.add(mesh);
        particles.push(mesh);
    }
    
    // --- 树顶小星星 (简化为普通材质) ---
    const topStarGeo = new THREE.OctahedronGeometry(1.5, 0); // 更小
    const topStarMat = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // 普通黄色
    const topStar = new THREE.Mesh(topStarGeo, topStarMat);
    topStar.position.set(0, TREE_HEIGHT/2 + 1.5, 0);
    scene.add(topStar);

    // --- 移除背景星尘，进一步减轻渲染压力 ---

    // ================= HAND TRACKING LOGIC =================
    const videoElement = document.getElementById('input_video');
    const statusElement = document.getElementById('hand-status');
    const loaderElement = document.getElementById('loader');
    
    let targetExplosionFactor = 0; 
    let currentExplosionFactor = 0;

    function onResults(results) {
        loaderElement.style.display = 'none';
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            const palm = landmarks[9];
            const tips = [4, 8, 12, 16, 20];
            let totalDist = 0;
            tips.forEach(idx => {
                const tip = landmarks[idx];
                totalDist += Math.sqrt(Math.pow(tip.x - palm.x, 2) + Math.pow(tip.y - palm.y, 2));
            });
            const avgDist = totalDist / 5;
            
            let openess = (avgDist - 0.08) * 4; 
            openess = Math.max(0, Math.min(1, openess));
            
            targetExplosionFactor = Math.pow(openess, 1.2); // 稍微减弱爆炸爆发力

            statusElement.innerHTML = openess > 0.5 ? "👐 已张开" : "✊ 已聚合";
            statusElement.style.color = openess > 0.5 ? "#ff3333" : "#ffffff";
        } else {
            statusElement.innerHTML = "等待摄像头...";
            statusElement.style.color = "#ffffff";
        }
    }

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 }); // modelComplexity: 0 更快但可能精度稍低
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => await hands.send({image: videoElement}),
        width: 160, height: 120 // 更低的摄像头分辨率
    });
    cameraUtils.start();

    // ================= ANIMATION LOOP =================
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        const lerpSpeed = targetExplosionFactor > currentExplosionFactor ? 0.06 : 0.03; // 更平滑的插值速度
        currentExplosionFactor += (targetExplosionFactor - currentExplosionFactor) * lerpSpeed;

        // 整体缓慢旋转
        scene.rotation.y += 0.001; 

        // 树顶星星动画
        topStar.rotation.y = time * 0.3;

        // 更新粒子
        particles.forEach(p => {
            const targetPos = new THREE.Vector3().lerpVectors(p.userData.treePos, p.userData.explodePos, currentExplosionFactor);
            p.position.lerp(targetPos, 0.08); // 更平滑的移动
            
            p.rotation.x += p.userData.rotSpeed.x;
            p.rotation.y += p.userData.rotSpeed.y;
            p.rotation.z += p.userData.rotSpeed.z;

            // 炸开时稍微放大，但幅度更小
            const scale = 1 + currentExplosionFactor * 0.1; 
            p.scale.setScalar(scale);
        });

        renderer.render(scene, camera); // 直接用 renderer 渲染
    }

    animate();

    // ================= RESIZE & UI =================
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

</script>
</body>
</html>
