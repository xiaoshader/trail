<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>触摸互动圣诞树 (高性能)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Arial', sans-serif; touch-action: none; }
        
        /* UI 覆盖层 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffd700;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }
        h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        p { font-size: 12px; opacity: 0.8; margin-top: 5px; }
        .status { color: #ffffff; font-weight: bold; }
        
        /* 移除视频反馈窗口和加载器 */
        #video-container, #loader { display: none; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    </head>
<body>

    <div id="ui-layer">
        <h1>👆 触摸魔法树</h1>
        <p>状态: <span id="interaction-status" class="status">触摸屏幕开始互动...</span></p>
        <p>动作: **点击/点按** 切换形态 | **拖动** 旋转</p>
    </div>

<script>
    // ================= CONFIGURATION (轻量级配置) =================
    const PARTICLE_COUNT = 250; // 适当增加粒子，因为性能非常好
    const TREE_HEIGHT = 30;
    const TREE_BASE_RADIUS = 10;
    
    // ================= THREE.JS SETUP =================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 15, 50);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- 灯光设置 ---
    const ambientLight = new THREE.AmbientLight(0x444444);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffcc00, 1.5, 100);
    pointLight.position.set(0, 20, 30);
    scene.add(pointLight);

    // ================= MATERIALS =================
    const matGlowing = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.9 });
    const matRed = new THREE.MeshBasicMaterial({ color: 0xdd0000 });
    const matGreen = new THREE.MeshBasicMaterial({ color: 0x00aa44 });

    // ================= CREATE PARTICLES =================
    const particles = [];
    const geoSphereTiny = new THREE.SphereGeometry(0.3, 8, 8); 
    const geoBoxTiny = new THREE.BoxGeometry(0.5, 0.5, 0.5);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        let mesh;
        const rand = Math.random();

        if (rand < 0.5) { 
            mesh = new THREE.Mesh(geoSphereTiny, matGlowing);
        } else if (rand < 0.75) { 
            mesh = new THREE.Mesh(geoSphereTiny, matRed);
        } else { 
            mesh = new THREE.Mesh(geoBoxTiny, matGreen);
        }

        // --- 树形态位置计算 ---
        const p = i / PARTICLE_COUNT;
        const heightProgress = Math.pow(p, 0.8); 
        const yTree = heightProgress * TREE_HEIGHT - (TREE_HEIGHT / 2);
        const radiusAtY = TREE_BASE_RADIUS * (1 - heightProgress);
        const angle = i * 0.7 + Math.random() * 0.5;
        const randomRadiusOffset = Math.random() * radiusAtY * 0.4;
        const xTree = Math.cos(angle) * (radiusAtY - randomRadiusOffset);
        const zTree = Math.sin(angle) * (radiusAtY - randomRadiusOffset);
        
        // --- 爆炸形态位置计算 ---
        const explodeR = (Math.random() * 0.5 + 0.5) * 45; // 更大的爆炸范围
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        
        const xExp = explodeR * Math.sin(phi) * Math.cos(theta);
        const yExp = explodeR * Math.sin(phi) * Math.sin(theta);
        const zExp = explodeR * Math.cos(phi);

        mesh.userData = {
            treePos: new THREE.Vector3(xTree, yTree, zTree),
            explodePos: new THREE.Vector3(xExp, yExp, zExp),
            rotSpeed: new THREE.Vector3( 
                (Math.random()-0.5)*0.03, 
                (Math.random()-0.5)*0.03, 
                (Math.random()-0.5)*0.03
            ),
            initialRot: new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI)
        };

        mesh.position.copy(mesh.userData.treePos);
        mesh.rotation.copy(mesh.userData.initialRot);
        
        scene.add(mesh);
        particles.push(mesh);
    }
    
    // --- 树顶小星星 ---
    const topStarGeo = new THREE.OctahedronGeometry(1.5, 0); 
    const topStarMat = new THREE.MeshBasicMaterial({ color: 0xffff00 }); 
    const topStar = new THREE.Mesh(topStarGeo, topStarMat);
    topStar.position.set(0, TREE_HEIGHT/2 + 1.5, 0);
    scene.add(topStar);

    // ================= INTERACTION LOGIC =================
    const statusElement = document.getElementById('interaction-status');
    let isExploded = false; // 当前状态：false=聚合，true=爆炸
    let targetExplosionFactor = 0; 
    let currentExplosionFactor = 0;
    
    // --- 拖动旋转变量 ---
    let isDragging = false;
    let previousTouchX = 0;
    
    function updateExplosionState() {
        isExploded = !isExploded;
        targetExplosionFactor = isExploded ? 1.0 : 0.0;
        statusElement.innerHTML = isExploded ? "🚀 **爆炸形态**" : "🌲 **聚合形态**";
        statusElement.style.color = isExploded ? "#ff5555" : "#ffffff";
    }

    // 监听触摸/鼠标按下事件
    function onInteractionStart(event) {
        event.preventDefault(); // 阻止浏览器默认行为，如滑动页面
        isDragging = true;
        
        // 获取触摸点或鼠标位置
        previousTouchX = event.touches ? event.touches[0].clientX : event.clientX;
    }

    // 监听触摸/鼠标移动事件
    function onInteractionMove(event) {
        if (!isDragging) return;
        event.preventDefault(); 

        const currentX = event.touches ? event.touches[0].clientX : event.clientX;
        const deltaX = currentX - previousTouchX;
        
        // 根据拖动的距离旋转场景
        scene.rotation.y += deltaX * 0.005; // 旋转灵敏度
        
        previousTouchX = currentX;
    }

    // 监听触摸/鼠标抬起事件
    function onInteractionEnd(event) {
        event.preventDefault();
        
        // 简单点击/点按时才切换状态（这里我们不实现复杂逻辑，直接切换）
        // 手机上通常需要计算触摸开始和结束时的位置差来区分点击和拖动
        
        // 为了简单：只要抬起就停止拖动
        if(isDragging) {
             // 仅在拖动很小时才认为是“点击”，否则视为旋转
             // 这里为了简化，我们只在抬起时重置拖动状态
             isDragging = false;
        }

        // 切换爆炸状态 (如果需要区分点击/拖动，需要更复杂的逻辑，这里保持最简单)
        // updateExplosionState(); // 移除自动切换，让用户可以持续拖动
    }
    
    // 监听点击事件来切换形态 (更可靠的点击检测)
    window.addEventListener('click', updateExplosionState, false);

    renderer.domElement.addEventListener('mousedown', onInteractionStart, false);
    renderer.domElement.addEventListener('mousemove', onInteractionMove, false);
    renderer.domElement.addEventListener('mouseup', onInteractionEnd, false);
    
    renderer.domElement.addEventListener('touchstart', onInteractionStart, false);
    renderer.domElement.addEventListener('touchmove', onInteractionMove, false);
    renderer.domElement.addEventListener('touchend', onInteractionEnd, false);

    // ================= ANIMATION LOOP =================
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        // 更快的插值速度，提高“响应”灵敏度
        const lerpSpeed = targetExplosionFactor > currentExplosionFactor ? 0.15 : 0.1;
        currentExplosionFactor += (targetExplosionFactor - currentExplosionFactor) * lerpSpeed;

        // 树顶星星动画
        topStar.rotation.y = time * 0.3;

        // 更新粒子
        particles.forEach(p => {
            const targetPos = new THREE.Vector3().lerpVectors(p.userData.treePos, p.userData.explodePos, currentExplosionFactor);
            p.position.lerp(targetPos, 0.2); // 更快的粒子移动速度
            
            p.rotation.x += p.userData.rotSpeed.x;
            p.rotation.y += p.userData.rotSpeed.y;
            p.rotation.z += p.userData.rotSpeed.z;

            const scale = 1 + currentExplosionFactor * 0.15; 
            p.scale.setScalar(scale);
        });

        renderer.render(scene, camera); 
    }

    animate();

    // ================= RESIZE =================
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

</script>
</body>
</html>
